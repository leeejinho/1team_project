<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>장사 TIP</title>
    <link rel="stylesheet" href="style/bizTip.css" />
  </head>
  <body>
    <header>
      <div class="region">금천구 가산동</div>
      <div class="logo">아프리카 사장이다</div>
      <div class="name">
        <spqn class="dataName">임사장</spqn>
        <span>사장님</span>
      </div>

      <button class="logout">로그아웃</button>
    </header>

    <nav class="nav">
      <div class="bord">
        <div class="boardTitle">자유게시판</div>
        <ul>
          <li class="bordCard"><a href="#">자유수다</a></li>
        </ul>
      </div>

      <div class="bord">
        <div class="boardTitle">공지사항</div>
        <ul>
          <li class="bordCard"><a href="#">공지사항</a></li>
          <li class="bordCard"><a href="#">문의</a></li>
          <li class="bordCard"><a href="#">신고</a></li>
        </ul>
      </div>

      <div class="bord">
        <div class="boardTitle">정보공유</div>
        <ul>
          <li class="bordCard"><a href="#">장사TIP</a></li>
          <li class="bordCard"><a href="#">Q&A</a></li>
          <li class="bordCard"><a href="#">동네소식</a></li>
        </ul>
      </div>

      <div class="bord">
        <div class="boardTitle">중고거래</div>
        <ul>
          <li class="bordCard"><a href="#">중고거래</a></li>
        </ul>
      </div>

      <div class="searchBar">
        <input type="text" class="searchInput" />
        <button class="searchBtn">검색</button>
      </div>
    </nav>

    <div class="bodyWarp">
      <div class="bodyWrapHader">
        <h2 class="tilte">작성하기 TIP</h2>
        <button class="writeBtn">작성하기</button>
        <hr />
      </div>

      <table class="boardList" border="1">
        <tr>
          <th>제목</th>
          <th>작성자</th>
          <th>작성일</th>
          <th>조회수</th>
          <th>추천</th>
        </tr>
        <td>
          <span>오픈초기 마케팅 비용 아끼지마세요</span>
          <span class="commentCount">[212]</span>
        </td>
        <td>가산동 불주먹</td>
        <td>2026.09.23</td>
        <td>1615</td>
        <td>111</td>
      </table>

      <div class="pagination">
        <button class="paginationPrev">&lt;</button>
        <a href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">4</a>
        <a href="#">5</a>
        <button class="paginationPrev">&gt;</button>
      </div>

      <search>
        <select class="searchSelect">
          <option value="title">제목</option>
          <option value="author">작성자</option>
          <option value="content">내용</option>
          <option value="titleContent">제목+내용</option>
        </select>

        <div class="searchBar">
          <input type="text" class="searchInput" />
          <button class="searchBtn">검색</button>
        </div>
      </search>
    </div>
  </body>
</html>
